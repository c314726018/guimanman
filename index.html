<!DOCTYPE html>

  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#334155; color:#cbd5e1; }

  select:focus, input:focus, textarea:focus { outline:none; border-color:#2563eb; }
  textarea { font-family:ui-monospace,monospace; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  label.f { display:flex; flex-direction:column; gap:3px; font-size:12px; color:#475569; }
  .add-btn { margin-top:10px; width:100%; background:#0f172a; color:#fff; }
  .add-btn:hover { background:#1e293b; }
  .mini-btn { margin-top:8px; width:100%; background:#eef2f7; color:#334155; border:1px dashed #c3cdd9; }
  .mini-btn:hover { background:#e2e8f0; }
  .paste-box { display:none; margin-top:8px; }
  .paste-box.open { display:block; }
  .paste-actions { display:flex; gap:8px; margin-top:6px; }

  .goods-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid #e8ecf1; border-radius:8px; margin-bottom:6px; font-size:13px; background:#fafbfd; }
  .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .goods-item .info { flex:1; line-height:1.4; }
  .goods-item .name { font-weight:600; }
  .goods-item .dim { color:#64748b; font-size:12px; }
  .del { color:#94a3b8; cursor:pointer; font-size:16px; background:none; border:none; padding:2px 6px; }
  .del:hover { color:#dc2626; }
  .hint { font-size:12px; color:#94a3b8; margin-top:4px; line-height:1.5; }

  /* 结果区 */
  .results { background:#fff; border-top:1px solid #e2e5ea; padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex-shrink:0; min-height:52px; }
  .chip { background:#f1f5f9; border-radius:8px; padding:6px 14px; font-size:13px; display:flex; flex-direction:column; }
  .chip b { font-size:15px; color:#0f172a; }
  .chip .u { color:#64748b; font-size:11px; }
  .chip.warn { background:#fef2f2; } .chip.warn b { color:#b91c1c; }
  .chip.good { background:#f0fdf4; } .chip.good b { color:#15803d; }
  .msg { font-size:13px; color:#b45309; }

  /* 画布 */
  .canvas-wrap { flex:1; position:relative; background:#e8ecf1; overflow:hidden; }
  .canvas-wrap canvas { display:block; }
  .container-tabs { position:absolute; top:10px; left:12px; z-index:10; display:flex; gap:6px; flex-wrap:wrap; max-width:70%; }
  .ctab { background:#fff; border:1px solid #d3d9e2; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .ctab.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  .legend { position:absolute; bottom:10px; left:12px; z-index:10; background:rgba(255,255,255,.92); border-radius:8px; padding:8px 12px; font-size:12px; max-width:320px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .legend div { display:flex; align-items:center; gap:6px; margin:2px 0; }
  .toast { position:absolute; top:50px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:8px 18px; border-radius:8px; font-size:13px; z-index:20; display:none; max-width:80%; }
  .empty-tip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:15px; flex-direction:column; gap:8px; }
  .empty-tip .big { font-size:40px; }

  .drag-hint { position:absolute; bottom:10px; right:12px; z-index:9; color:#64748b; font-size:11px; background:rgba(255,255,255,.85); padding:4px 10px; border-radius:10px; pointer-events:none; }

  /* 装载步骤面板 */
  .steps-panel { position:absolute; top:10px; right:12px; bottom:10px; width:320px; z-index:15; background:rgba(255,255,255,.97); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.18); padding:14px; overflow-y:auto; display:none; }
  .steps-panel.open { display:block; }
  .steps-panel h4 { font-size:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .steps-panel .close-x { background:none; border:none; font-size:16px; cursor:pointer; color:#94a3b8; }
  .step-row { display:flex; gap:8px; padding:7px 8px; border-radius:8px; background:#f6f8fb; margin-bottom:6px; font-size:12px; align-items:center; }
  .step-row .num { background:#2563eb; color:#fff; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .step-row .desc { line-height:1.4; flex:1; }

  /* 偏载分布条 */
  .balance { display:flex; flex-direction:column; gap:3px; font-size:11px; color:#64748b; }
  .bal-bar { display:flex; height:14px; border-radius:7px; overflow:hidden; width:150px; }
  .bal-bar div { display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; }
  .bal-lr .l { background:#2563eb; } .bal-lr .r { background:#0891b2; }
  .bal-fb .f2 { background:#059669; } .bal-fb .b2 { background:#d97706; }
  .bal-warn { color:#b91c1c; font-size:12px; }

  /* 自定义柜型 */
  #customBox { display:none; margin-top:8px; padding:10px; background:#f6f8fb; border-radius:8px; }
  #customBox.open { display:block; }
  #customBox .grid2 { margin-top:0; }

  /* 立放复选框 */
  .cb { display:flex; flex-direction:row !important; align-items:center; gap:6px; margin-top:8px; font-size:13px; color:#334155; cursor:pointer; }
  .cb input { width:15px; height:15px; }

  /* 手机端 */
  @media (max-width: 900px) {
    header { padding:8px 10px; gap:8px; }
    header h1 { font-size:15px; }
    header .btn { padding:6px 10px; font-size:12px; }
    header .spacer { display:none; }
    .main { flex-direction:column; }
    .canvas-wrap { order:-1; min-height:44vh; flex:none; }
    .sidebar { width:100%; flex:1; order:1; border-right:none; border-top:1px solid #e2e5ea; }
    .results { order:0; background:#fff; border-top:1px solid #e2e5ea; padding:8px 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex-shrink:0; min-height:44px; font-size:12px; }
    .chip { padding:4px 10px; }
    .steps-panel { width:min(320px, 86vw); }
  }
  @media (max-width: 480px) {
    header .tag { display:none; }
    .chip .u { font-size:10px; }

<body>
<header>
  <h1 id="hTitle">📦 柜满满</h1>
  <span class="tag" id="tagFree">免费</span>
  <div class="spacer"></div>
  <select id="langSel" title="Language"></select>
  <select id="unitSel" title="Units"></select>
  <button class="btn btn-ghost" id="btnImport">导入 CSV/Excel</button>
  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.txt" style="display:none">
  <button class="btn btn-ghost" id="btnSample">载入示例</button>
  <button class="btn btn-ghost" id="btnShare">分享链接</button>
  <button class="btn btn-ghost" id="btnLogo">Logo</button>
  <input type="file" id="logoInput" accept="image/*" style="display:none">
  <button class="btn btn-ghost" id="btnSavePlan">保存方案</button>
  <button class="btn btn-ghost" id="btnSteps">装载步骤</button>
  <button class="btn btn-ghost" id="btnEdit">✎</button>
  <select id="selReportLang" title="Report language"></select>
  <select id="selReportTpl" title="Template"><option value="std">A</option><option value="det">A+</option></select>
  <button class="btn btn-ghost" id="btnPdf">导出 PDF</button>
  <button class="btn btn-ghost" id="btnShot">导出截图</button>
  <button class="btn btn-primary" id="btnCalc">开始计算</button>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sec">
      <h3 id="hCont">集装箱型号</h3>
      <select id="containerSel"></select>
      <div class="hint" id="containerInfo"></div>
      <div id="customBox">
        <div class="grid2">
          <label class="f"><span id="cuLlb">内长 (cm)</span><input type="number" id="cuL" placeholder="600"></label>
          <label class="f"><span id="cuWlb">内宽 (cm)</span><input type="number" id="cuW" placeholder="235"></label>
          <label class="f"><span id="cuHlb">内高 (cm)</span><input type="number" id="cuH" placeholder="240"></label>
          <label class="f"><span id="cuPlb">额定载重 (kg)</span><input type="number" id="cuP" placeholder="20000"></label>
        </div>
      </div>
    </div>

    <div class="sec">
      <h3 id="hAdd">添加货物</h3>
      <input type="text" id="gName">
      <div class="grid4">
        <label class="f"><span id="lbL">长</span><input type="number" id="gL" placeholder="60" min="0.1"></label>
        <label class="f"><span id="lbW">宽</span><input type="number" id="gW" placeholder="40" min="0.1"></label>
        <label class="f"><span id="lbH">高</span><input type="number" id="gH" placeholder="40" min="0.1"></label>
        <label class="f"><span id="lbQty">件数</span><input type="number" id="gQty" placeholder="100" min="1"></label>
      </div>
      <div class="grid2">
        <label class="f"><span id="lbKg">单件重量 (kg)</span><input type="number" id="gKg" placeholder="10" min="0"></label>
        <label class="f"><span id="lbStack">最大堆叠层数</span><input type="number" id="gStack" value="5" min="1" max="20"></label>
      </div>
      <div class="grid2">
        <label class="f"><span id="lbMaxLoad">可承载重量 (kg)</span><input type="number" id="gMaxLoad" placeholder="不限" min="0"></label>
        <label class="f"><span id="lbOverhang">允许悬空比率</span><input type="number" id="gOverhang" placeholder="0.7" min="0.1" max="1" step="0.05"></label>
      </div>
      <div class="grid2">
        <label class="f"><span id="lbPriority">装载优先级</span><input type="number" id="gPriority" placeholder="0" min="0"></label>
        <label class="f"><span id="perSetLb">每套数量</span><input type="number" id="gPerSet" placeholder="0" min="0"></label>
      </div>
      <label class="cb"><input type="checkbox" id="gUpright"><span id="lbUpright">禁止旋转（保持直立）</span></label>
      <label class="cb"><input type="checkbox" id="gMustFloor"><span id="lbMustFloor">必须放底层</span></label>
      <label class="cb"><input type="checkbox" id="gCyl"><span id="lbCyl">圆柱形（桶/管）</span></label>
      <button class="btn add-btn" id="btnAdd">＋ 添加货物</button>
      <div class="hint" id="stackHint"></div>
      <button class="btn mini-btn" id="btnPasteToggle">📋 粘贴导入</button>
      <div class="paste-box" id="pasteBox">
        <textarea id="pasteTa" rows="5"></textarea>
        <div class="paste-actions">
          <button class="btn btn-green" id="btnPasteAdd">确认导入</button>
          <button class="btn btn-ghost" id="btnPasteCancel" style="background:#e2e8f0;color:#334155">取消</button>
        </div>
        <div class="hint" id="pasteHint"></div>
      </div>
    </div>

    <div class="sec">
      <h3 id="hAdv">高级选项</h3>
      <label class="f"><span id="gapLb">摆放间隙 (cm/件)</span><input type="number" id="advGap" value="0" min="0" step="0.5"></label>
      <div class="grid2" style="margin-top:8px">
        <label class="f"><span id="reeferLb">冷藏机组预留长度 (cm)</span><input type="number" id="advReefer" value="0" min="0"></label>
        <label class="f"><span id="doorLb">门端限高 (cm)</span><input type="number" id="advDoor" value="0" min="0"></label>
      </div>
      <div class="grid2" style="margin-top:8px">
        <label class="f"><span id="setsLb">套数</span><input type="number" id="advSets" value="1" min="1"></label>
        <label class="f"><span>&nbsp;</span><input type="text" style="visibility:hidden" tabindex="-1"></label>
      </div>
      <label class="cb" style="margin-top:10px"><input type="checkbox" id="palletChk"><span id="palletModeLb">打托模式（先码托盘再装柜）</span></label>
      <div id="palletBox" style="display:none">
        <div class="grid4">
          <label class="f"><span id="paLlb">托盘长(cm)</span><input type="number" id="paL" value="110" min="1"></label>
          <label class="f"><span id="paWlb">托盘宽(cm)</span><input type="number" id="paW" value="110" min="1"></label>
          <label class="f"><span id="paHlb">限高(cm)</span><input type="number" id="paH" value="180" min="1"></label>
          <label class="f"><span id="paPlb">限重(kg)</span><input type="number" id="paP" value="1000" min="1"></label>
        </div>
      </div>
    </div>

    <div class="sec">
      <h3><span id="hList">货物清单</span>（<span id="goodsCount">0</span>）</h3>
      <div class="goods-list" id="goodsList"></div>
    </div>

    <div class="sec">
      <h3 id="hPlans">我的方案</h3>
      <div class="row">
        <select id="planSel"></select>
      </div>
      <div class="grid2" style="margin-top:6px">
        <button class="btn btn-ghost" id="btnLoadPlan" style="background:#eef2f7;color:#334155">载入</button>
        <button class="btn btn-ghost" id="btnDelPlan" style="background:#eef2f7;color:#334155">删除</button>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <div class="container-tabs" id="containerTabs"></div>
    <div class="empty-tip" id="emptyTip"><div class="big">📦</div><span id="emptyTipText">添加货物后点击「开始计算」</span></div>
    <div class="legend" id="legend" style="display:none"></div>
    <div class="toast" id="toast"></div>
    <div class="drag-hint" id="dragHint"></div>
    <div class="steps-panel" id="stepsPanel">
      <h4><span id="stepsTitle">装载步骤</span><button class="close-x" id="stepsClose">✕</button></h4>
      <div id="stepsBody"></div>
    </div>
  </div>
</div>

<div class="results" id="results"></div>

const toCm = v => unit === "in" ? v * IN2CM : v;
const dispCm = v => unit === "in" ? +(v / IN2CM).toFixed(1) : +(v.toFixed(1));

function getContainer() {
  const key = document.getElementById("containerSel").value;
  if (key === "custom") return { ...customCont };
  return CONTAINERS[key];
}

/* ============ 计算 ============ */
function calc(silent) {
  if (!goods.length) { toast(t().tNeedGoods); return; }
  const c = { ...getContainer(),
    reeferLen: +document.getElementById("advReefer").value || 0,
    doorH: +document.getElementById("advDoor").value || 0 };
  const gap = +document.getElementById("advGap").value || 0;
  const usePallet = document.getElementById("palletChk").checked;
  const sets = Math.max(1, +document.getElementById("advSets").value || 1);
  showTip(t().calcing);
  setTimeout(() => {
    try {
      let packGoods = goods.map(g => (sets > 1 && +g.perSet > 0) ? { ...g, qty: Math.round(g.perSet * sets) } : g);
      if (usePallet) {
        const spec = { l: +document.getElementById("paL").value || 110,
                       w: +document.getElementById("paW").value || 110,
                       h: +document.getElementById("paH").value || 180,
                       payload: +document.getElementById("paP").value || 1000 };
        packGoods = PackLib.packPallets(goods, spec).pallets;
      }
      packResults = PackLib.packAll(packGoods, c, { gap });
      currentContainerIdx = 0;
      renderTabs();
      renderScene();
      renderResults();
      if (document.getElementById("stepsPanel").classList.contains("open")) buildSteps();
      if (!silent) toast(t().tDone);
    } catch (e) {
      console.error(e);
      toast(t().tCalcErr + e.message);
    }
    showTip(null);
  }, 30);
}

function renderResults() {
  const el = document.getElementById("results");
  const c = getContainer();
  const cs = packResults.containers;
  const stuckN = packResults.stuck.length;
  let totalBoxes = 0;
  cs.forEach(r => r.placed.forEach(p => { totalBoxes++; }));
  const cur = cs[currentContainerIdx];
  const vol = (cur.placed.reduce((s, p) => s + p.L * p.W * p.H, 0)) / 1e6;
  const volUtil = vol / (c.l * c.w * c.h / 1e6) * 100;
  const kg = cur.placed.reduce((s, p) => s + p.kg, 0);
  const kgUtil = kg / c.payload * 100;

  let html = "";
  if (cs.length > 1) html += chip(cs.length, t().needCont, cs.length > 1 ? "warn" : "good");  html += chip(volUtil.toFixed(1) + "%", t().volUtil, volUtil >= 75 ? "good" : "");
  html += chip(totalBoxes, t().loadedN, "");
  html += chip(fmtKg(kg) + " kg", t().grossW, "");
  html += chip(kgUtil.toFixed(0) + "%", t().loadUse, kgUtil > 95 ? "warn" : "");
  if (stuckN) html += '<span class="msg">' + t().stuckMsg(stuckN) + '</span>';
  else if (volUtil < 50) html += '<span class="msg">' + t().lowVolTip + '</span>';
  html += balanceHtml(cur.placed, c);
  el.innerHTML = html;
}

/* 偏载/重心校验：前后（沿柜长）与左右（沿柜宽）分布 */
function balanceHtml(placed, c) {
  if (!placed.length) return "";
  let wL = 0, wR = 0, wF = 0, wB = 0, total = 0, cgx = 0, cgy = 0, cgz = 0;
  for (const p of placed) {
    total += p.kg;
    cgx += p.kg * (p.x + p.L / 2); cgy += p.kg * (p.y + p.W / 2); cgz += p.kg * (p.z + p.H / 2);
    if (p.x + p.L / 2 < c.l / 2) wF += p.kg; else wB += p.kg;
    if (p.y + p.W / 2 < c.w / 2) wL += p.kg; else wR += p.kg;
  }
  if (!total) return "";
  const pct = w => Math.round(w / total * 100);
  const pL = pct(wL), pF = pct(wF);
  const bad = pL > 60 || pL < 40 || pF > 60 || pF < 40;
  const bar = (a, b, pa, la, lb, cls) =>
    '<div class="bal-bar ' + cls + '"><div class="' + la + '" style="width:' + pa + '%">' + pa + '%</div>' +
    '<div class="' + lb + '" style="width:' + (100 - pa) + '%">' + (100 - pa) + '%</div></div>';
  let h = '<div class="balance"><b>' + t().balTitle + '</b>';
  h += '<div>' + t().balLR + '</div>' + bar(wL, wR, pL, "l", "r", "bal-lr");
  h += '<div>' + t().balFB + '</div>' + bar(wF, wB, pF, "f2", "b2", "bal-fb");
  h += '<div>' + esc(t().sideL) + '/' + esc(t().sideR) + ' · ' + esc(t().sideF) + '/' + esc(t().sideB) + '</div>';
  if (bad) h += '<div class="bal-warn">' + t().balWarn + '</div>';
  h += '</div>';
  return h;
}
function chip(v, u, cls) { return '<div class="chip ' + cls + '"><b>' + v + '</b><span class="u">' + u + '</span></div>'; }
function fmtKg(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : Math.round(n); }

/* ============ Three.js 场景 ============ */
let renderer, scene, camera, controls, containerMeshes = [];

function initThree() {
  const wrap = document.querySelector(".canvas-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  wrap.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8ecf1);

  camera = new THREE.PerspectiveCamera(45, w / h, 1, 10000);
  camera.position.set(900, 700, 900);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dl = new THREE.DirectionalLight(0xffffff, 0.7);
  dl.position.set(600, 1200, 800);
  scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dl2.position.set(-800, 500, -600);
  scene.add(dl2);

  window.addEventListener("resize", () => {
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    renderer.setSize(w2, h2);
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
  });
  animate();
  renderer.domElement.addEventListener("pointerdown", onCanvasDown);
  renderer.domElement.addEventListener("pointermove", onCanvasMove);
  renderer.domElement.addEventListener("pointerup", onCanvasUp);
}
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

function clearScene() {
  while (containerMeshes.length) {
    const m = containerMeshes.pop();
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  }
}

function buildContainerFrame(c) {
  const group = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.BoxGeometry(c.l, 2, c.w), new THREE.MeshLambertMaterial({ color: 0xc8cfda }));
  floor.position.set(c.l / 2, -1, c.w / 2);
  group.add(floor);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(c.l, c.h, c.w)),
    new THREE.LineBasicMaterial({ color: 0x475569 })
  );
  edges.position.set(c.l / 2, c.h / 2, c.w / 2);
  group.add(edges);
  const grid = new THREE.GridHelper(Math.max(c.l, c.w), Math.round(Math.max(c.l, c.w) / 100), 0xb0b8c4, 0xd5dae2);
  grid.position.set(c.l / 2, -1.9, c.w / 2);
  group.add(grid);
  containerMeshes.push(group, floor, edges, grid);
  scene.add(group);
  return group;
}

function buildBoxes(placed) {
  const group = new THREE.Group();
  for (const p of placed) {
    let geo, edgeGeo;
    if (p.cylinder) {
      const rx = Math.min(p.L, p.W) / 2;
      geo = new THREE.CylinderGeometry(rx, rx, p.H, 24);
      edgeGeo = new THREE.EdgesGeometry(geo, 30);
    } else {
      geo = new THREE.BoxGeometry(p.L, p.H, p.W);
      edgeGeo = new THREE.EdgesGeometry(geo);
    }
    const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(p.color), transparent: true, opacity: 0.92 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(p.x + p.L / 2, p.z + p.H / 2, p.y + p.W / 2);
    mesh.userData.box = p;
    group.add(mesh);
    const edge = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x1e293b }));
    edge.position.copy(mesh.position);
    group.add(edge);
  }
  containerMeshes.push(group);
  scene.add(group);
  return group;
}

function fitCamera(c) {
  const d = Math.max(c.l, c.w, c.h);
  camera.position.set(c.l * 0.85, d * 0.9, c.w * 1.35);
  controls.target.set(c.l / 2, c.h / 2.8, c.w / 2);
  controls.update();
}

function renderScene() {
  if (!renderer) initThree();
  clearScene();
  const c = getContainer();
  document.getElementById("emptyTip").style.display = "none";
  buildContainerFrame(c);
  const cur = packResults && packResults.containers[currentContainerIdx];
  if (cur) buildBoxes(cur.placed);
  fitCamera(c);
  renderLegend(cur ? cur.placed : []);
}

/* 首屏预览：无结果时也展示空柜框架 */
function renderPreview() {
  if (!renderer) initThree();
  clearScene();
  buildContainerFrame(getContainer());
  fitCamera(getContainer());
}

function renderLegend(placed) {
  const el = document.getElementById("legend");
  if (!placed.length) { el.style.display = "none"; return; }
  const seen = new Map();
  placed.forEach(p => {
    if (!seen.has(p.gi)) seen.set(p.gi, { color: p.color, name: p.name, n: 1 });
    else seen.get(p.gi).n++;
  });
  el.innerHTML = [...seen.values()].map(v =>
    '<div><span class="dot" style="background:' + v.color + '"></span>' + esc(v.name) + ' × ' + v.n + '</div>'
  ).join("");
  el.style.display = "block";
}

function renderTabs() {
  const el = document.getElementById("containerTabs");
  const n = packResults ? packResults.containers.length : 0;
  if (n <= 1) { el.innerHTML = ""; return; }
  el.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const b = document.createElement("button");
    b.className = "ctab" + (i === currentContainerIdx ? " active" : "");
    b.textContent = t().cab(i + 1);
    b.onclick = () => { currentContainerIdx = i; renderTabs(); renderScene(); renderResults(); if (document.getElementById("stepsPanel").classList.contains("open")) buildSteps(); };
    el.appendChild(b);
  }
}

/* 装载步骤：按放置顺序合并同货品，附柜内区位 */
function buildSteps() {
  const cur = packResults && packResults.containers[currentContainerIdx];
  const body = document.getElementById("stepsBody");
  if (!cur || !cur.placed.length) { body.innerHTML = '<div class="hint">' + t().stepsEmpty + '</div>'; return; }
  const c = getContainer();
  const zone = x0 => x0 < c.l / 3 ? t().zoneR : (x0 < 2 * c.l / 3 ? t().zoneM : t().zoneF);
  // placed 顺序即放置顺序（重货/大件先放）
  const steps = [];
  for (const p of cur.placed) {
    const last = steps[steps.length - 1];
    if (last && last.gi === p.gi) { last.n++; last.zMin = Math.min(last.zMin, p.z); last.xMin = Math.min(last.xMin, p.x); }
    else steps.push({ gi: p.gi, name: p.name, color: p.color, n: 1, zMin: p.z, xMin: p.x });
  }
  body.innerHTML = steps.map((s, i) => {
    const layer = Math.round(s.zMin / (c.h / 4)) + 1; // 粗略层位提示
    return '<div class="step-row"><div class="num">' + (i + 1) + '</div>' +
      '<span class="dot" style="background:' + s.color + '"></span>' +
      '<div class="desc"><b>' + esc(s.name) + '</b> × ' + s.n + '<br><span style="color:#94a3b8">' +
      zone(s.xMin) + ' · ' + t().stackN(Math.max(1, layer)) + '</span></div></div>';
  }).join("");
}

function toggleSteps(open) {
  const el = document.getElementById("stepsPanel");
  const show = open !== undefined ? open : !el.classList.contains("open");
  if (show && packResults) buildSteps();
  el.classList.toggle("open", show);
}

function addGoods() {
  const name = document.getElementById("gName").value.trim() || (t().goodsName + (goodsSeq + 1));
  const l = toCm(+document.getElementById("gL").value), w = toCm(+document.getElementById("gW").value),
        h = toCm(+document.getElementById("gH").value), qty = +document.getElementById("gQty").value,
        kg = +document.getElementById("gKg").value || 0, stack = +document.getElementById("gStack").value || 5,
        upright = document.getElementById("gUpright").checked,
        maxLoad = +document.getElementById("gMaxLoad").value || 0,
        priority = +document.getElementById("gPriority").value || 0,
        mustFloor = document.getElementById("gMustFloor").checked,
        cylinder = document.getElementById("gCyl").checked,
        overhang = +document.getElementById("gOverhang").value || 0,
        perSet = +document.getElementById("gPerSet").value || 0;
  if (!(l > 0 && w > 0 && h > 0)) { toast(t().tFillDims); return; }
  if (!(qty > 0)) { toast(t().tNeedQty); return; }
  goodsSeq++;
  goods.push({ name, l, w, h, qty, kg, stack, upright, maxLoad, priority, mustFloor, cylinder, overhang, perSet, color: PALETTE[(goodsSeq - 1) % PALETTE.length] });
  ["gName", "gL", "gW", "gH", "gQty", "gKg", "gMaxLoad", "gPriority", "gOverhang", "gPerSet"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("gStack").value = 5;
  document.getElementById("gUpright").checked = false;
  document.getElementById("gMustFloor").checked = false;
  document.getElementById("gCyl").checked = false;
  renderGoodsList();
  calc(true); // 加完自动算，无需手动点按钮
}

function delGoods(i) {
  goods.splice(i, 1);
  renderGoodsList();
  if (goods.length) calc(true);
  else {
    // 清空后回到初始预览态
    packResults = null;
    document.getElementById("results").innerHTML = "";
    document.getElementById("containerTabs").innerHTML = "";
    document.getElementById("stepsPanel").classList.remove("open");
    document.getElementById("emptyTip").style.display = "flex";
    renderPreview();
  }
}

function renderGoodsList() {
  document.getElementById("goodsCount").textContent = goods.length;
  // 有货物就隐藏中央提示，避免遮挡 3D 视图
  if (goods.length) document.getElementById("emptyTip").style.display = "none";
  else if (!packResults) document.getElementById("emptyTip").style.display = "flex";
  const el = document.getElementById("goodsList");
  if (!goods.length) { el.innerHTML = '<div class="hint">' + t().noGoods + '</div>'; return; }
  el.innerHTML = goods.map((g, i) =>
    '<div class="goods-item"><span class="dot" style="background:' + g.color + '"></span>' +
    '<div class="info"><div class="name">' + esc(g.name) + '</div>' +
    '<div class="dim">' + dispCm(g.l) + '×' + dispCm(g.w) + '×' + dispCm(g.h) + ' ' + (unit === "in" ? "in" : t().dimUnit) +
    ' ｜ ' + g.qty + ' ' + t().pcs + ' ｜ ' + g.kg + t().kgEach + ' ｜ ' + t().stackN(g.stack) +
    (g.upright ? ' ｜ ⬆' + t().upYes : '') + (g.cylinder ? ' ⛽' : '') + (g.mustFloor ? ' ⬇' : '') + '</div></div>' +    '<button class="del" data-i="' + i + '">✕</button></div>').join("");
  el.querySelectorAll(".del").forEach(b => b.onclick = () => delGoods(+b.dataset.i));
}

/* ============ 导入（共享 lib/importer.js） ============ */
function rowsToGoodsFromRows(rows) {
  const r = ImportLib.rowsToGoods(rows, PALETTE, goodsSeq);
  goods = goods.concat(r.goods);
  goodsSeq = r.seq;
  return r.goods.length;
}

function handleFile(file) {
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onload = e => {
    let rows = null;
    try {
      if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
        const wb = XLSX.read(e.target.result, { type: "array" });
        rows = [];
        for (const sn of wb.SheetNames) {
          rows = rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: "" }));
          rows.push([]); // 表间分隔
        }
      } else {
        rows = ImportLib.parseDelimited(e.target.result);
      }
      const n = rowsToGoodsFromRows(rows);
      if (n) { renderGoodsList(); calc(); toast(t().tImported(n)); }
      else toast(t().tPasteEmpty);
    } catch (err) {
      console.error(err);
      toast(t().tImportFail);
    }
  };
  if (name.endsWith(".xlsx") || name.endsWith(".xls")) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
}

function importPaste() {
  const text = document.getElementById("pasteTa").value;
  const n = rowsToGoodsFromRows(ImportLib.parseDelimited(text));
  if (n) {
    document.getElementById("pasteBox").classList.remove("open");
    document.getElementById("pasteTa").value = "";
    renderGoodsList();
    calc();
    toast(t().tImported(n));
  } else toast(t().tPasteEmpty);
}

/* ============ 本地方案库（localStorage） ============ */
function getPlans() { try { return JSON.parse(localStorage.getItem("zc_plans") || "[]"); } catch (e) { return []; } }
function savePlan() {
  if (!goods.length) { toast(t().tNeedGoods); return; }
  const name = prompt(t().planNamePrompt) || ("Plan " + new Date().toLocaleString());
  const plans = getPlans();
  plans.unshift({ name, date: Date.now(),
    data: { c: document.getElementById("containerSel").value, u: unit, g: serializeGoods(),
            cd: document.getElementById("containerSel").value === "custom" ? [customCont.l, customCont.w, customCont.h, customCont.payload] : null,
            gap: +document.getElementById("advGap").value || 0,
            pal: { on: document.getElementById("palletChk").checked,
                   l: +document.getElementById("paL").value, w: +document.getElementById("paW").value,
                   h: +document.getElementById("paH").value, p: +document.getElementById("paP").value } } });
  localStorage.setItem("zc_plans", JSON.stringify(plans.slice(0, 50)));
  renderPlanSel();
  toast(t().planSaved);
}
function loadPlan(i) {
  const plans = getPlans();
  const p = plans[i];
  if (!p) return;
  const d = p.data;
  unit = d.u || "cm";
  if (d.c === "custom" && d.cd) {
    customCont = { l: +d.cd[0] || 600, w: +d.cd[1] || 235, h: +d.cd[2] || 240, payload: +d.cd[3] || 20000 };
    document.getElementById("containerSel").value = "custom";
  } else if (d.c && CONTAINERS[d.c]) document.getElementById("containerSel").value = d.c;
  goods = deserializeGoods(d.g);
  goodsSeq = goods.length;
  document.getElementById("advGap").value = d.gap || 0;
  if (d.pal) {
    document.getElementById("palletChk").checked = !!d.pal.on;
    if (d.pal.l) { document.getElementById("paL").value = d.pal.l; document.getElementById("paW").value = d.pal.w;
      document.getElementById("paH").value = d.pal.h; document.getElementById("paP").value = d.pal.p; }
  }
  document.getElementById("palletBox").style.display = document.getElementById("palletChk").checked ? "block" : "none";
  refreshAll();
  if (goods.length) calc(true);
  toast(t().planLoaded);
}
function delPlan(i) {
  const plans = getPlans();
  plans.splice(i, 1);
  localStorage.setItem("zc_plans", JSON.stringify(plans));
  renderPlanSel();
  toast(t().planDeleted);
}
function renderPlanSel() {
  const el = document.getElementById("planSel");
  if (!el) return;
  const plans = getPlans();
  el.innerHTML = plans.length
    ? plans.map((p, i) => '<option value="' + i + '">' + esc(p.name) + '</option>').join("")
    : '<option value="">' + t().noPlans + '</option>';
}

/* ============ Logo 上传 ============ */
function handleLogo(file) {
  const reader = new FileReader();
  reader.onload = e => {
    localStorage.setItem("zc_logo", e.target.result);
    toast(t().planSaved);
  };

/* ============ 编辑模式：拖拽微调 ============ */
let editMode = false, dragBox = null, dragMesh = null;
const raycaster = new THREE.Raycaster(), dragPtr = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function toggleEdit() {
  editMode = !editMode;
  const b = document.getElementById("btnEdit");
  b.classList.toggle("active-edit", editMode);
  controls.enabled = !editMode;
  toast(t().editMode);
}

function ptrPos(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  dragPtr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  dragPtr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function onCanvasDown(e) {
  if (!editMode || !packResults) return;
  ptrPos(e);
  raycaster.setFromCamera(dragPtr, camera);
  const meshes = [];
  containerMeshes.forEach(m => { if (m.isMesh && m.userData.box) meshes.push(m); });
  const hits = raycaster.intersectObjects(meshes);
  if (!hits.length) return;
  dragMesh = hits[0].object;
  dragBox = dragMesh.userData.box;
  dragPlane.set(new THREE.Vector3(0, 1, 0), -(dragBox.z + dragBox.H / 2));
  controls.enabled = false;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
}

function onCanvasMove(e) {
  if (!dragBox) return;
  ptrPos(e);
  raycaster.setFromCamera(dragPtr, camera);
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(dragPlane, pt)) return;
  dragMesh.position.x = pt.x;
  dragMesh.position.z = pt.z;
}

function onCanvasUp() {
  if (!dragBox) return;
  const c = getContainer();
  const nx = dragMesh.position.x - dragBox.L / 2;
  const ny = dragMesh.position.z - dragBox.W / 2;
  if (validMove(dragBox, nx, ny, c)) {
    dragBox.x = nx; dragBox.y = ny;
    toast(t().editedOK);
  } else toast(t().editedBad);
  dragBox = null; dragMesh = null;
  controls.enabled = !editMode;
  renderScene();
  renderResults(); // 手动移动后刷新偏载/重量分布
  if (document.getElementById("stepsPanel").classList.contains("open")) buildSteps();
}

function validMove(box, nx, ny, c) {
  if (nx < -0.01 || ny < -0.01 || nx + box.L > c.l + 0.01 || ny + box.W > c.w + 0.01) return false;
  const cur = packResults.containers[currentContainerIdx].placed;
  for (const p of cur) {
    if (p === box) continue;
    if (nx < p.x + p.L && p.x < nx + box.L && ny < p.y + p.W && p.y < ny + box.W &&
        box.z < p.z + p.H && p.z < box.z + box.H) return false;
  }
  if (box.z > 0.3) {
    let area = 0;
    for (const p of cur) {
      if (p === box) continue;
      if (Math.abs(p.z + p.H - box.z) > 0.3) continue;
      const ox = Math.min(nx + box.L, p.x + p.L) - Math.max(nx, p.x);
      const oy = Math.min(ny + box.W, p.y + p.W) - Math.max(ny, p.y);
      if (ox > 0.5 && oy > 0.5) area += ox * oy;
    }
    if (area < box.L * box.W * (goods[box.gi].overhang || 0.7)) return false;
  }
  return true;
}

/* ============ 分享链接 ============ */
/* 序列化货物（分享/方案库共用，v2 含全部约束字段） */
function serializeGoods() {
  return goods.map(g => [g.name, g.l, g.w, g.h, g.qty, g.kg, g.stack,
    g.upright ? 1 : 0, g.maxLoad || 0, g.priority || 0, g.mustFloor ? 1 : 0,
    g.cylinder ? 1 : 0, g.overhang || 0, g.perSet || 0]);
}
function deserializeGoods(arr) {
  return (arr || []).map((r, i) => ({
    name: String(r[0] || (t().goodsName + (i + 1))), l: +r[1], w: +r[2], h: +r[3],
    qty: +r[4], kg: +r[5] || 0, stack: +r[6] || 5, upright: !!r[7],
    maxLoad: +r[8] || 0, priority: +r[9] || 0, mustFloor: !!r[10], cylinder: !!r[11],
    overhang: +r[12] || 0, perSet: +r[13] || 0, color: PALETTE[i % PALETTE.length],
  })).filter(g => g.l > 0 && g.w > 0 && g.h > 0 && g.qty > 0);
}

function encodeState() {
  const key = document.getElementById("containerSel").value;
  const st = {
    v: 2, c: key, u: unit, g: serializeGoods(),
    gap: +document.getElementById("advGap").value || 0,
    rf: +document.getElementById("advReefer").value || 0,
    dh: +document.getElementById("advDoor").value || 0,
    st: Math.max(1, +document.getElementById("advSets").value || 1),
    pal: { on: document.getElementById("palletChk").checked,
           l: +document.getElementById("paL").value, w: +document.getElementById("paW").value,
           h: +document.getElementById("paH").value, p: +document.getElementById("paP").value },
  };
  if (key === "custom") st.cd = [customCont.l, customCont.w, customCont.h, customCont.payload];
  return btoa(unescape(encodeURIComponent(JSON.stringify(st))));
}
function decodeState(str) {
  const st = JSON.parse(decodeURIComponent(escape(atob(str))));
  if (!st || !Array.isArray(st.g)) return false;
  if (st.c === "custom" && Array.isArray(st.cd)) {
    customCont = { l: +st.cd[0] || 600, w: +st.cd[1] || 235, h: +st.cd[2] || 240, payload: +st.cd[3] || 20000 };
    document.getElementById("containerSel").value = "custom";
  } else if (st.c && CONTAINERS[st.c]) {
    document.getElementById("containerSel").value = st.c;
  }
  if (st.u === "in" || st.u === "cm") unit = st.u;
  goods = deserializeGoods(st.g);
  goodsSeq = goods.length;
  document.getElementById("advGap").value = st.gap || 0;
  document.getElementById("advReefer").value = st.rf || 0;
  document.getElementById("advDoor").value = st.dh || 0;
  document.getElementById("advSets").value = st.st || 1;
  if (st.pal) {
    document.getElementById("palletChk").checked = !!st.pal.on;
    if (st.pal.l) { document.getElementById("paL").value = st.pal.l; document.getElementById("paW").value = st.pal.w;
      document.getElementById("paH").value = st.pal.h; document.getElementById("paP").value = st.pal.p; }
  }
  document.getElementById("palletBox").style.display = document.getElementById("palletChk").checked ? "block" : "none";
  return goods.length > 0;
}
function shareLink() {
  if (!goods.length) { toast(t().tNeedGoods); return; }
  const url = location.origin + location.pathname + "#d=" + encodeState();
  const done = () => toast(t().tCopied);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else fallbackCopy(url, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy");
  document.body.removeChild(ta);
  done();
}

/* ============ 截图 ============ */
function snapshot() {
  if (!renderer) { toast(t().tNoCalc); return; }
  const a = document.createElement("a");
  a.download = t().fileName + (currentContainerIdx + 1) + ".png";
  a.href = renderer.domElement.toDataURL("image/png");
  a.click();
  toast(t().tExported);
}

/* ============ 初始化 ============ */
function initUI() {
  // URL ?lang= 参数（SEO 落地页跳转用）
  const qs = new URLSearchParams(location.search);
  if (qs.get("lang") && I18N[qs.get("lang")]) { lang = qs.get("lang"); localStorage.setItem("zc_lang", lang); }
  refreshAll();
  updateContainerInfo();

  document.getElementById("langSel").onchange = e => {
    lang = e.target.value; localStorage.setItem("zc_lang", lang);
    refreshAll();
    if (packResults) { renderResults(); renderTabs(); }
  };
  document.getElementById("unitSel").onchange = e => {
    unit = e.target.value; localStorage.setItem("zc_unit", unit);
    renderGoodsList(); updateContainerInfo();
  };
  document.getElementById("containerSel").onchange = () => {
    const isCustom = document.getElementById("containerSel").value === "custom";
    document.getElementById("customBox").classList.toggle("open", isCustom);
    if (isCustom) {
      document.getElementById("cuL").value = customCont.l;
      document.getElementById("cuW").value = customCont.w;
      document.getElementById("cuH").value = customCont.h;
      document.getElementById("cuP").value = customCont.payload;
    }
    updateContainerInfo();
    if (goods.length) calc(true); // 换柜型自动重算
  };
  ["cuL", "cuW", "cuH", "cuP"].forEach(id => {
    document.getElementById(id).oninput = () => {
      customCont = {
        l: +document.getElementById("cuL").value || customCont.l,
        w: +document.getElementById("cuW").value || customCont.w,
        h: +document.getElementById("cuH").value || customCont.h,
        payload: +document.getElementById("cuP").value || customCont.payload,
      };
      updateContainerInfo();
    };
  });
  document.getElementById("btnSteps").onclick = () => toggleSteps();
  document.getElementById("stepsClose").onclick = () => toggleSteps(false);
  document.getElementById("btnPdf").onclick = exportPdf;
  document.getElementById("btnEdit").onclick = toggleEdit;
  document.getElementById("btnSavePlan").onclick = savePlan;
  document.getElementById("btnLogo").onclick = () => document.getElementById("logoInput").click();
  const rsel = document.getElementById("selReportLang");
  rsel.innerHTML = '<option value="auto">Auto</option>' + LANGS.map(x => '<option value="' + x[0] + '">' + x[1] + '</option>').join("");
  document.getElementById("logoInput").onchange = e => { if (e.target.files.length) handleLogo(e.target.files[0]); e.target.value = ""; };
  document.getElementById("planSel").onchange = e => { if (e.target.value !== "") loadPlan(+e.target.value); };
  document.getElementById("btnLoadPlan").onclick = () => { const v = +document.getElementById("planSel").value; if (getPlans()[v]) loadPlan(v); };
  document.getElementById("btnDelPlan").onclick = () => { const v = +document.getElementById("planSel").value; if (getPlans()[v]) delPlan(v); };
  document.getElementById("advGap").oninput = () => { if (goods.length) calc(true); };
  document.getElementById("palletChk").onchange = () => {
    document.getElementById("palletBox").style.display = document.getElementById("palletChk").checked ? "block" : "none";
    if (goods.length) calc(true);
  };
  ["paL", "paW", "paH", "paP"].forEach(id => {
    document.getElementById(id).oninput = () => { if (goods.length && document.getElementById("palletChk").checked) calc(true); };
  });
  document.getElementById("btnAdd").onclick = addGoods;
  document.getElementById("btnCalc").onclick = calc;
  document.getElementById("btnSample").onclick = loadSample;
  document.getElementById("btnShot").onclick = snapshot;
  document.getElementById("btnShare").onclick = shareLink;
  document.getElementById("btnImport").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("btnPasteToggle").onclick = () =>
    document.getElementById("pasteBox").classList.toggle("open");
  document.getElementById("btnPasteAdd").onclick = importPaste;
  document.getElementById("btnPasteCancel").onclick = () =>
    document.getElementById("pasteBox").classList.remove("open");

  // 分享链接自动恢复
  if (location.hash.startsWith("#d=")) {
    try {
      if (decodeState(location.hash.slice(3))) {
        refreshAll();
        calc();
        history.replaceState(null, "", location.pathname);
        return;
      }
    } catch (e) { console.error(e); }
  }
  renderPreview();
}

/* ============ PDF 报告 ============ */
function exportPdf() {
  if (!packResults || !packResults.containers.length) { toast(t().tNoCalc); return; }
  let company = localStorage.getItem("zc_company") || "";
  if (!company) {
    company = prompt(t().pdfCompany) || "";
    if (company) localStorage.setItem("zc_company", company);
  }
  const langR = document.getElementById("selReportLang").value;
  const R = (langR !== "auto" && I18N[langR]) ? I18N[langR] : t();
  const tpl = document.getElementById("selReportTpl").value;
  const done = async () => {
    showTip(t().calcing);
    // 逐柜渲染并截图
    const shots = [];
    const savedIdx = currentContainerIdx;
    for (let i = 0; i < packResults.containers.length && i < 12; i++) {
      currentContainerIdx = i;
      renderScene();
      await new Promise(r => setTimeout(r, 60));
      shots.push(renderer.domElement.toDataURL("image/png"));
    }
    currentContainerIdx = savedIdx;
    renderScene(); renderTabs(); renderResults();
    showTip(null);
    openReport(company, shots, R, tpl, langR);
  };
  done();
}

function openReport(company, shots, R, tpl, langR) {
  const c = getContainer();
  const date = new Date().toLocaleDateString(langR === "auto" ? lang : langR);
  let contHtml = "";
  packResults.containers.forEach((ct, i) => {
    const vol = (ct.placed.reduce((s, p) => s + p.L * p.W * p.H, 0)) / 1e6;
    const volUtil = vol / (c.l * c.w * c.h / 1e6) * 100;
    const kg = ct.placed.reduce((s, p) => s + p.kg, 0);
    const steps = [];
    for (const p of ct.placed) {
      const last = steps[steps.length - 1];
      if (last && last.gi === p.gi) last.n++;
      else steps.push({ gi: p.gi, name: p.name, n: 1 });
    }
    contHtml += '<div class="cont"><h2>' + t().cab(i + 1) + '</h2>' +
      '<p>' + t().volUtil + ': <b>' + volUtil.toFixed(1) + '%</b> ｜ ' + t().loadedN + ': <b>' + ct.placed.length + '</b> ｜ ' +
      t().grossW + ': <b>' + Math.round(kg) + ' kg</b></p>' +
      (shots[i] ? '<img class="shot" src="' + shots[i] + '">' : '') +
      '<h3>' + R.rSteps + '</h3><ol class="rsteps">' +
      steps.map(s => '<li>' + esc(s.name) + ' × ' + s.n + '</li>').join("") + '</ol>' +
      (tpl === "det" ? '<h3>' + R.rSteps + ' (X/Y/Z)</h3><table><tr><th>#</th><th>X</th><th>Y</th><th>Z</th><th>L×W×H</th></tr>' +
        ct.placed.slice(0, 60).map(p => '<tr><td>' + esc(p.name) + '</td><td>' + Math.round(p.x) + '</td><td>' + Math.round(p.y) + '</td><td>' + Math.round(p.z) + '</td><td>' + p.L + '×' + p.W + '×' + p.H + '</td></tr>').join("") + '</table>' : '') +
      '</div>';
  });
  const goodsRows = goods.map(g =>
    '<tr><td>' + esc(g.name) + '</td><td>' + g.l + '</td><td>' + g.w + '</td><td>' + g.h + '</td>' +
    '<td>' + g.qty + '</td><td>' + g.kg + '</td><td>' + g.stack + '</td><td>' + (g.upright ? R.upYes : "-") + '</td></tr>').join("");
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + esc(R.rTitle) + '</title><style>' +
    'body{font-family:-apple-system,"PingFang SC",sans-serif;color:#1a1a1a;margin:32px;max-width:900px}' +
    '.logo{max-height:56px;margin-bottom:8px}' +
    'h1{font-size:22px;border-bottom:3px solid #2563eb;padding-bottom:8px}' +
    '.co{font-size:13px;color:#64748b}.cont{page-break-inside:avoid;margin:24px 0;border:1px solid #e2e5ea;border-radius:8px;padding:16px}' +
    '.cont h2{font-size:16px;margin:0 0 8px}.shot{width:100%;max-width:640px;border:1px solid #e2e5ea;border-radius:4px}' +
    '.rsteps{font-size:13px;columns:2;column-gap:32px}.rsteps li{margin:2px 0}' +
    'table{border-collapse:collapse;width:100%;font-size:12px;margin:12px 0}' +
    'th,td{border:1px solid #d3d9e2;padding:5px 8px;text-align:left}th{background:#f0f3f8}' +
    '@media print{body{margin:12mm}}</style></head><body>' +
    (localStorage.getItem("zc_logo") ? '<img class="logo" src="' + localStorage.getItem("zc_logo") + '"><br>' : '') +
    (company ? '<div class="co"><b style="font-size:16px;color:#1a1a1a">' + esc(company) + '</b></div>' : '') +
    '<h1>📦 ' + esc(R.rTitle) + '</h1>' +
    '<p class="co">' + R.rDate + ': ' + date + ' ｜ ' + esc(t().contLabels ? "" : "") +
    document.getElementById("containerSel").value + ' ｜ ' + c.l + '×' + c.w + '×' + c.h + ' cm</p>' +
    '<h3>' + R.rGoods + '</h3>' +
    '<table><tr><th>#</th><th>L(cm)</th><th>W(cm)</th><th>H(cm)</th><th>' + R.lbQty + '</th><th>kg</th><th>' + R.lbStack + '</th><th>' + R.upYes + '</th></tr>' +
    goodsRows + '</table>' + contHtml +
    '<p class="co" style="margin-top:32px">📦 ' + esc(R.app) + '</p>' +
    '<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script>' +
    '</body></html>';
  const w = window.open("", "_blank");
  if (!w) { toast(t().tExported); return; }
  w.document.write(html);
  w.document.close();
}

/* ============ 工具 ============ */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = "none", 2600);
}
function showTip(msg) {
  const el = document.getElementById("toast");
  if (msg) { el.textContent = msg; el.style.display = "block"; }
  else el.style.display = "none";
}

initUI();
