server {
    listen 80;
    server_name guimanman.com www.guimanman.com;

    # 装柜计算器主站（静态）
    root /var/www/guimanman;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 证书签发后取消注释并重载 nginx（certbot 会自动改写）
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/guimanman.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/guimanman.com/privkey.pem;
}
